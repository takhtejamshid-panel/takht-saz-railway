# ==========================================================================
#  wrangler.toml — پیکربندی باتِ لانچرِ ریلیوی (تخت‌ساز Railway)
#  مقدارهایی که باید پیش از استقرار پر شوند با REPLACE_ME مشخص شده‌اند.
# ==========================================================================
name = "takht-saz-railway"
main = "_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
#  اتصالِ KV — نام باید دقیقاً BOT_KV باشد
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "a2f9dfe1ce664ccf8fe741cec5167f6f"

# ---------------------------------------------------------------------------
#  متغیرهای معمولی (نه راز)
# ---------------------------------------------------------------------------
[vars]
# مخزنی که پنلِ FastAPI از آن استقرار می‌یابد (باید public باشد)
RAILWAY_REPO = "takhtejamshid-panel/takht-e-jamshid-backend"
# شعبه‌ی مخزن
RAILWAY_BRANCH = "main"
# نامِ سرویس در ریلیو (در ابتدای نام هر سرویس قرار می‌گیرد)
RAILWAY_SERVICE_PREFIX = "takht-panel"
# حداکثر پنل برای هر کاربر در ساعت
MAX_DEPLOYS_PER_HOUR = "3"
# سقفِ کلِ بات در ساعت (محافظت از سهمیه‌ی رایگان)
MAX_GLOBAL_PER_HOUR = "40"
# URL پایه‌ی پنل برای معتبر شمردنِ لینک پایانی (پسوند دومین ریلیو)
RAILWAY_DOMAIN_SUFFIX = "up.railway.app"

# ---------------------------------------------------------------------------
#  رازها — از طریق دستورِ زیر تنظیم شوند (هرگز در این فایل ننویسید):
#    npx wrangler secret put TELEGRAM_TOKEN
#    npx wrangler secret put WEBHOOK_SECRET
# ---------------------------------------------------------------------------
